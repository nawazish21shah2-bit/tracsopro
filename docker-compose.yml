version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tracsopro
      POSTGRES_PASSWORD: tracsopro
      POSTGRES_DB: tracsopro
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data

  pgbouncer:
    image: bitnami/pgbouncer:1
    environment:
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USERNAME: tracsopro
      POSTGRESQL_PASSWORD: tracsopro
      POSTGRESQL_DATABASE: tracsopro
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 200
      PGBOUNCER_DEFAULT_POOL_SIZE: 20
    ports:
      - '6432:6432'
    depends_on:
      - postgres

volumes:
  redis_data:
  pg_data:
