name: OWASP ZAP Staging Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    if: vars.STAGING_URL != ''
    steps:
      - name: Baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ vars.STAGING_URL }}
          allow_issue_writing: false
          fail_action: false