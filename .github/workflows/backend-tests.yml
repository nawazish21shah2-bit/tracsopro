name: Backend Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'

jobs:
  tenant-isolation:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: guard_tracking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/guard_tracking_test?schema=public
      DIRECT_DATABASE_URL: postgresql://test:test@localhost:5432/guard_tracking_test?schema=public
      JWT_SECRET: ci-integration-test-jwt-secret-min-32-chars-long
      NODE_ENV: test
      RATE_LIMIT_MAX: '10000'
      AUTH_RATE_LIMIT_MAX: '1000'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Prepare database schema
        working-directory: backend
        run: npx prisma db push

      - name: Run all tests
        working-directory: backend
        run: npm test

      - name: Coverage gate (core modules)
        working-directory: backend
        run: npm run test:coverage

      - name: Coverage gate (full codebase)
        working-directory: backend
        run: npm run test:coverage:all

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck
